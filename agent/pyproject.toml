[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-agent"
dynamic = ["version"]
description = "Outbound-only agent that starts/stops a Cloudflare Quick Tunnel on request"
requires-python = ">=3.9"
dependencies = ["requests", "websocket-client"]

[tool.setuptools.dynamic]
version = { attr = "tunnel_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
# No UP rules on purpose: the plan requires typing.Optional (Python 3.9 compatible).
select = ["E", "F", "I", "B", "W"]

[tool.mypy]
python_version = "3.9"
files = ["src"]
ignore_missing_imports = true
